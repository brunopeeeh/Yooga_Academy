<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yooga Academy · Protótipo do Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto+Slab:wght@400;500&display=swap">
<style>
:root{
  --navy:#23324D; --ink:#23324D; --muted:#5A6B85; --soft:#8796AB; --line:#E3EAF2; --line2:#EEF2F7;
  --bg:#F5F8FB; --card:#FFFFFF; --blue:#1D9BD7; --blue-ink:#0B6FA8; --blue-bg:#E8F5FC;
  --green:#12805C; --green-ink:#0E6B4C; --green-bg:#E3F4EC; --red:#C2410C; --red-ink:#9A3412; --red-bg:#FFF4EE;
  --orange:#E8762D; --orange-bg:#FFF8EF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-size:15px}
a{color:var(--blue-ink)} a:hover{color:#08557F}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid #7CCBF0;outline-offset:2px}
.slab{font-family:'Roboto Slab',Georgia,serif}
.cap{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px}
.bar{height:6px;border-radius:3px;background:#E8EEF5;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 22px;text-align:center;line-height:1.3;border-radius:10px;border:0;background:var(--blue);color:#fff;font-weight:600;font-size:15px;text-decoration:none}
.btn:hover{background:#1687BD;color:#fff}
.btn.dark{background:var(--navy)} .btn.dark:hover{background:#1A2740}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #DCE4EE;font-weight:500}
.btn[disabled]{background:#C9D5E2;cursor:not-allowed}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.c-done{background:var(--green-bg);color:var(--green-ink)} .c-doing{background:var(--blue-bg);color:var(--blue-ink)}
.c-next{background:#FFF3E6;color:#9A4A0E} .c-todo{background:#EEF2F7;color:var(--muted)}
h1,h2,h3{font-weight:600;margin:0}

/* topo */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:24px;height:66px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo span{width:34px;height:34px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
.nav{display:flex;gap:4px}
.nav a{padding:8px 14px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14px;text-decoration:none}
.nav a[aria-current=page]{background:var(--blue-bg);color:var(--blue-ink);font-weight:600}
.me{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:13px;color:var(--muted)}
.role{display:flex;background:#EEF2F7;border-radius:999px;padding:3px}
.role button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.role button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.avatar{width:36px;height:36px;border-radius:50%;background:#D7E6F3;display:grid;place-items:center;font-weight:600;color:var(--ink)}
main{padding:28px 0 48px}

/* início */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.cont{background:var(--navy);color:#fff;border-radius:16px;padding:26px 28px;display:flex;gap:22px;align-items:center;position:relative;overflow:hidden}
.cont:after{content:"";position:absolute;right:-50px;bottom:-70px;width:240px;height:240px;border-radius:50%;border:28px solid rgba(29,155,215,.18)}
.cont>*{position:relative;z-index:1}
.cont .btn{background:#fff;color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats b{font-size:26px;font-weight:600} .stats small{font-size:14px;color:var(--muted);font-weight:500}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.gcard{display:flex;flex-direction:column;gap:12px;padding:22px;background:#fff;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);position:relative}
.gcard:hover{border-color:var(--blue)}
.gcard.doing{border:2px solid var(--blue);box-shadow:0 8px 24px rgba(29,155,215,.15)}
.gcard .chip{position:absolute;top:18px;right:18px}
.gcard p{margin:0;font-size:13px;line-height:1.5;color:#4A5A72;flex:1}
.final{display:flex;align-items:center;gap:16px;padding:16px 22px;border:1px dashed #B9C8D9;border-radius:14px;background:#fff;color:var(--muted)}

/* grupo */
.ghead{background:#fff;border-bottom:1px solid var(--line)}
.ghead .wrap{display:flex;align-items:center;gap:24px;padding-top:20px;padding-bottom:22px}
.glayout{display:flex;gap:28px;align-items:flex-start}
.mods{width:320px;flex:none;display:flex;flex-direction:column;gap:4px;position:sticky;top:90px}
.mod{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:10px;border:1px solid transparent;background:none;text-align:left;color:var(--ink);width:100%}
.mod:hover{background:#EDF3F9}
.mod[aria-current=true]{background:#fff;border-color:var(--blue)}
.list{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:13px 18px;border-top:1px solid var(--line2);text-decoration:none;color:var(--ink)}
.row:hover{background:#F7FAFD}
.ck{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid #C9D5E2;background:#fff}
.ck.done{background:var(--green);border-color:var(--green)}
.ck.now{border-color:var(--blue)} .ck.now:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue)}
.pill{display:inline-block;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;text-decoration:none;background:#fff}

/* aula */
.lesson{display:flex;gap:32px;align-items:flex-start}
.side{width:250px;flex:none;display:flex;flex-direction:column;gap:2px;position:sticky;top:90px}
.side a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;font-size:13px;text-decoration:none;color:var(--ink)}
.side a[aria-current=page]{background:var(--blue-bg);font-weight:600}
.side .ck{width:20px;height:20px}
article.box{flex:1;min-width:0;padding:30px 40px;display:flex;flex-direction:column;gap:20px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:28px}
.step{display:flex;gap:14px}
.num{width:28px;height:28px;border-radius:50%;background:var(--blue-bg);color:var(--blue-ink);font-weight:600;font-size:13px;display:grid;place-items:center;flex:none}
.p{margin:0;font-size:15px;line-height:1.65;color:#33435E}
kbd{font-family:Poppins,sans-serif;font-size:13px;font-weight:600;background:#F1F5F9;border:1px solid #DCE4EE;border-radius:5px;padding:1px 6px}
.warn{display:flex;gap:12px;padding:14px 16px;border-radius:12px;background:var(--orange-bg);border:1px solid #F6E3CB;color:#6B3A10;font-size:14px;line-height:1.55}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:20px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border-radius:10px;border:1px solid #DCE4EE;background:#fff;font-size:14px;color:var(--ink)}
.opt:hover:not([disabled]){border-color:var(--blue)}
.opt.ok{border:2px solid var(--green);background:#F2FAF6} .opt.bad{border:2px solid var(--red);background:var(--red-bg)}
.opt[disabled]{cursor:default}
.lfoot{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);margin-top:24px}
.lfoot .wrap{display:flex;align-items:center;gap:14px;height:76px}

/* quiz */
.qwrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px;padding-bottom:140px}
.qopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;border-radius:12px;border:1px solid #DCE4EE;background:#fff;font-size:16px;color:var(--ink)}
.qopt:hover:not([disabled]){border-color:var(--blue)}
.qopt[aria-checked=true]{border:2px solid var(--blue);background:#F0F8FD}
.qopt.ok,.qopt.ok[aria-checked=true]{border:2px solid var(--green);background:#F2FAF6} .qopt.bad,.qopt.bad[aria-checked=true]{border:2px solid var(--red);background:var(--red-bg)}
.qopt.dim{color:var(--soft)}
.let{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;background:#EEF2F7;color:var(--muted)}
.qopt[aria-checked=true] .let{background:var(--blue);color:#fff}
.qopt.ok .let{background:var(--green);color:#fff} .qopt.bad .let{background:var(--red);color:#fff}

.dots{display:flex;gap:6px} .dots i{width:30px;height:8px;border-radius:4px;background:#DCE4EE}
.dots i.ok{background:var(--green)} .dots i.bad{background:var(--red)} .dots i.cur{background:var(--blue)}
.fb{position:fixed;left:0;right:0;bottom:0;border-top:2px solid;z-index:6}
.fb .wrap{display:flex;align-items:center;gap:20px;padding-top:20px;padding-bottom:24px}
.fb.ok{background:#F2FAF6;border-color:#A9DCC5} .fb.bad{background:var(--red-bg);border-color:#F3C4A6} .fb.idle{background:#fff;border-color:var(--line)}

/* resultado */
.res{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px}
.score{background:var(--navy);color:#fff;border-radius:18px;padding:30px 32px;display:flex;gap:28px;align-items:center}
.ring{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring>div{width:104px;height:104px;border-radius:50%;background:var(--navy);display:grid;place-items:center;text-align:center}
.qline{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line2)}
.xp{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-top:1px solid var(--line2)}

/* conquistas */
.seals{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.seal{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:18px 10px;border-radius:14px;border:1px dashed #C9D5E2;text-decoration:none;color:var(--ink)}
.seal.done{background:#F2FAF6;border:1px solid #BFE3D2} .seal.doing{background:#F0F8FD;border:1px solid #BDE0F3}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.lv b{font-size:13px;color:var(--ink)} .lv.cur{border-color:var(--blue);background:var(--blue-bg)}
.act{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line2);font-size:14px}

/* biblioteca */
.search{background:var(--navy);padding:30px 0 34px}
.search .wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.sbox{width:min(760px,100%);display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;border-radius:12px;background:#fff}
.sbox input{flex:1;min-width:0;border:0;font:inherit;font-size:17px;outline:none;color:var(--ink);background:none}
.filters{width:250px;flex:none;display:flex;flex-direction:column;gap:20px}
.filters label{display:flex;align-items:center;gap:10px;font-size:14px;padding:5px 0}
.filters input{width:18px;height:18px;accent-color:var(--blue)}
.hit{display:flex;gap:16px;align-items:flex-start;padding:16px 22px;border-top:1px solid var(--line2);text-decoration:none;color:var(--ink)}
.hit:hover{background:#F7FAFD}
mark{background:#FFF1B8;color:inherit;padding:0 2px;border-radius:3px}

/* líder */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:2px} .kpi b{font-size:26px;font-weight:600}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;background:#FAFCFE;border-bottom:1px solid var(--line2)}
td{padding:13px 14px;border-bottom:1px solid var(--line2);font-size:14px}
.g8{display:grid;grid-template-columns:repeat(8,20px);gap:4px} .g8 i{height:20px;border-radius:5px;background:#E8EEF5}
.g8 i.s{background:var(--green)} .g8 i.c{background:#7CCBF0}
.errs{background:var(--navy);color:#fff;border-radius:16px;padding:20px 22px}
.errs div{padding:12px 0;border-top:1px solid rgba(255,255,255,.12)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--navy);color:#fff;padding:14px 18px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:9;display:flex;gap:10px;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:900px){
  .wrap{padding:0 16px}
  .top .wrap{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px;gap:10px}
  .me{margin-left:0;width:100%;justify-content:space-between;flex-wrap:wrap;gap:10px}
  .kpis{grid-template-columns:1fr 1fr} .chip{white-space:normal}
  .cont{flex-direction:column;align-items:flex-start}
  .ghead .wrap{flex-wrap:wrap} .ghead .wrap>div:last-child{width:100%!important}
  .score{flex-direction:column;align-items:flex-start}
  .tbl{min-width:0!important} .errs,.box[style*="width:360px"]{width:100%}
  aside[style*="width:360px"]{width:100%!important}
  .lfoot .wrap{height:auto;padding-top:12px;padding-bottom:12px;flex-wrap:wrap}
  .fb .wrap{flex-wrap:wrap}
  .seals{grid-template-columns:repeat(2,1fr)} section[style*="grid-column:span 2"]{grid-column:auto!important}
  .hero,.res{grid-template-columns:1fr}
  .glayout,.lesson{flex-direction:column} .mods,.side,.filters{width:100%;position:static}
  .nav a{padding:8px 8px} .me .lvlbox{display:none}
  article.box{padding:22px;width:100%} article.box>div:first-child{flex-wrap:wrap} article.box h1{font-size:24px!important}
  .kpis{grid-template-columns:repeat(2,1fr)} .levels{grid-template-columns:repeat(2,1fr)}
  .tbl{overflow-x:auto}
}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="top"></div></header>
<div id="app"></div>
<div id="live" class="sr" aria-live="polite"></div>

const AULAS = {}, MODS = {}, GRUPOS = {};

  });

let S, ui;
function estadoInicial() {
  S = { papel: 'analista', concluidas: new Set(), checks: {}, quiz: {}, selos: new Set(), xp: 0, log: [], sequencia: 2 };
  const pp = SEED.grupos[0];
  pp.modulos.forEach(m => m.essenciais.forEach(a => S.concluidas.add(a.id)));
  pp.quizMods.forEach(m => S.quiz[m.id] = { melhor: 6, total: 6, aprovado: true });
  S.selos.add(pp.id);
  S.xp = pp.nEss * REGRAS.aula + 6 * REGRAS.acerto + REGRAS.selo;
  const card = SEED.grupos[1].modulos[0].essenciais;
  [card[0], card[1]].forEach(a => { S.concluidas.add(a.id); S.xp += REGRAS.aula; });
  S.log = [
    { t: 'Concluiu ' + card[1].titulo, q: 'ontem', xp: 10 },
    { t: 'Concluiu ' + card[0].titulo, q: 'ontem', xp: 10 },
    { t: 'Selo ' + pp.nome, q: '4 nov', xp: 30 },
    { t: 'Passou no quiz de ' + pp.nome + ' · 6/6', q: '4 nov', xp: 30 }
  ];
  ui = { quiz: null, filtroTipo: { essencial: true, consulta: true }, filtroGrupo: new Set(), soNaoVistas: false, busca: '' };
}
estadoInicial();

const nivel = () => Math.min(Math.floor(S.xp / REGRAS.nivel), NIVEIS.length - 1);
const essFeitas = m => m.essenciais.filter(a => S.concluidas.has(a.id)).length;
const grupoFeitas = g => g.modulos.reduce((s, m) => s + essFeitas(m), 0);
const quizLiberado = m => m.tem_quiz && essFeitas(m) === m.essenciais.length;
const quizAprovados = g => g.quizMods.filter(m => S.quiz[m.id] && S.quiz[m.id].aprovado).length;
function statusGrupo(g) {
  if (S.selos.has(g.id)) return 'done';
  const feitas = grupoFeitas(g) + quizAprovados(g);
  if (feitas > 0) return 'doing';
  const ant = SEED.grupos[g.idx - 1];
  if (ant && ['done', 'doing'].includes(statusGrupo(ant))) return 'next';
  return 'todo';
}
const ROT = { done: ['Concluído', 'c-done'], doing: ['Em andamento', 'c-doing'], next: ['Próximo', 'c-next'], todo: ['A fazer', 'c-todo'] };
function proximaAula() {
  for (const g of SEED.grupos) for (const m of g.modulos) {
    for (const a of m.essenciais) if (!S.concluidas.has(a.id)) return { tipo: 'aula', a };
    if (m.tem_quiz && !(S.quiz[m.id] && S.quiz[m.id].aprovado)) return { tipo: 'quiz', m };
  }
  return null;
}
function ganhar(xp, texto) {
  const antes = nivel();
  S.xp += xp;
  S.log.unshift({ t: texto, q: 'agora', xp });
  if (nivel() > antes) toast('Subiu para o Nível ' + (nivel() + 1) + ' · ' + NIVEIS[nivel()]);
}
function verificaSelo(g) {
  if (!S.selos.has(g.id) && g.quizMods.length && quizAprovados(g) === g.quizMods.length) {
    S.selos.add(g.id); ganhar(REGRAS.selo, 'Selo ' + g.nome); return true;
  }
  return false;
}

function telaAula(id) {
  topo('inicio');
  const a = AULAS[id]; if (!a) return go('#/inicio');
  const m = a.modulo, g = m.grupo, c = CONTEUDO[id], ess = a.tipo === 'essencial';
  const lista = m.essenciais, i = lista.indexOf(a), feito = S.concluidas.has(id);
  const resp = S.checks[id] || {};
  const checksOk = !c || !ess || c.checks.every((k, j) => resp[j] === k.c);
  const prox = lista[i + 1];
  const corpo = c ? `
      <div class="steps">${c.blocos.map(b => `<section style="display:flex;flex-direction:column;gap:14px"><h2 style="font-size:17px">${b.titulo}</h2>${b.passos.map((p, n) => `<div class="step"><span class="num">${n + 1}</span><p class="p">${p}</p></div>`).join('')}</section>`).join('')}</div>
      <div class="warn"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C25E14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12 3l10 18H2zM12 10v5M12 18h.01"/></svg><p class="slab" style="margin:0"><b>Na hora do atendimento:</b> ${c.alerta}</p></div>
      ${ess ? `<section aria-labelledby="chk" style="border-top:1px solid var(--line2);padding-top:18px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:baseline;gap:10px"><h2 id="chk" style="font-size:16px">Confere rápido</h2><span style="font-size:13px;color:var(--muted)">${c.checks.length} perguntas · não valem nota</span></div>
        <div class="checks">${c.checks.map((k, j) => { const r = resp[j], ok = r === k.c;
          return `<div style="display:flex;flex-direction:column;gap:8px"><b style="font-size:14px;font-weight:500">${esc(k.q)}</b>
            ${k.o.map((o, n) => `<button class="opt ${r === n ? (ok ? 'ok' : 'bad') : ''}" data-ck="${j}" data-o="${n}" ${ok ? 'disabled' : ''}>${esc(o)}</button>`).join('')}
            ${r !== undefined ? `<span class="slab" style="font-size:13px;color:${ok ? 'var(--green-ink)' : 'var(--red-ink)'}">${ok ? esc(k.ok) : 'Ainda não. Releia os passos acima e tente de novo.'}</span>` : ''}
          </div>`; }).join('')}</div>
      </section>` : ''}` : `
      <div class="box" style="padding:22px;display:flex;flex-direction:column;gap:10px;background:#FAFCFE">
        <b style="font-weight:600">Conteúdo desta aula</b>
        <p class="slab p" style="color:#4A5A72">No protótipo só as aulas de Produtos e Complementos têm texto próprio. Na versão final, cada aula traz o resumo do artigo da Central${ess ? ' e 2 perguntas de conferência' : ''}.</p>
        <a href="${a.url_central}" target="_blank" rel="noopener">Ler o artigo na Central de Ajuda</a>
      </div>`;
  document.getElementById('app').innerHTML = `<main><div class="wrap lesson">
    <nav class="side" aria-label="Aulas do módulo">
      <a href="#/grupo/${g.id}/${m.id}" style="color:var(--blue-ink);font-weight:500;margin-bottom:8px">‹ ${esc(g.nome)}</a>
      <span class="cap" style="padding:0 10px 8px">${esc(m.nome)}</span>
      ${lista.map(x => `<a href="#/aula/${x.id}" ${x === a ? 'aria-current="page"' : ''} style="${S.concluidas.has(x.id) && x !== a ? 'color:var(--muted)' : ''}"><span class="ck ${S.concluidas.has(x.id) ? 'done' : x === a ? 'now' : ''}">${S.concluidas.has(x.id) ? CHECK : ''}</span>${esc(x.titulo)}</a>`).join('')}
      ${m.tem_quiz ? `<a href="${quizLiberado(m) ? '#/quiz/' + m.id : '#/grupo/' + g.id + '/' + m.id}" style="color:#9A4A0E;margin-top:4px"><span class="ck" style="border-color:var(--orange)"></span>Quiz do módulo</a>` : ''}
    </nav>
    <article class="box">
      <div style="display:flex;align-items:flex-start;gap:16px">
        <div style="flex:1"><span class="cap" style="color:${ess ? 'var(--blue-ink)' : 'var(--muted)'}">${ess ? 'Essencial' : 'Leitura de apoio'}${c ? ' · ' + c.min + ' min' : ''}${ess ? ` · aula ${i + 1} de ${lista.length}` : ''}</span><h1 style="margin:4px 0 6px;font-size:30px">${esc(a.titulo)}</h1>${c ? `<p class="slab p" style="color:#4A5A72">${c.intro}</p>` : ''}</div>
        <a href="${a.url_central}" target="_blank" rel="noopener" style="font-size:13px;white-space:nowrap;margin-top:6px">Abrir na Central</a>
      </div>
      ${corpo}
    </article>
  </div></main>
  ${ess ? `<div class="lfoot"><div class="wrap">
    ${i > 0 ? `<a href="#/aula/${lista[i - 1].id}" style="font-size:14px;font-weight:500;text-decoration:none">‹ ${esc(lista[i - 1].titulo)}</a>` : ''}
    <span style="margin-left:auto;font-size:13px;color:var(--muted)">${feito ? 'Aula concluída' : checksOk ? '' : 'Responda as perguntas para concluir'}</span>
    ${feito ? `<a class="btn" href="${prox ? '#/aula/' + prox.id : quizLiberado(m) ? '#/quiz/' + m.id : '#/grupo/' + g.id + '/' + m.id}">${prox ? 'Próxima aula' : 'Ir para o quiz'}</a>`
      : `<button class="btn" id="concluir" ${checksOk ? '' : 'disabled'}>Concluir aula · +${REGRAS.aula} XP</button>`}
  </div></div>` : ''}`;
  document.querySelectorAll('[data-ck]').forEach(b => b.onclick = () => {
    S.checks[id] = Object.assign({}, S.checks[id], { [b.dataset.ck]: +b.dataset.o }); render();
    fala(+b.dataset.o === c.checks[+b.dataset.ck].c ? 'Resposta certa' : 'Resposta errada, tente de novo');
  });
  const btn = document.getElementById('concluir');
  if (btn) btn.onclick = () => {
    S.concluidas.add(id); ganhar(REGRAS.aula, 'Concluiu ' + a.titulo); toast('+' + REGRAS.aula + ' XP · aula concluída');
    if (prox) go('#/aula/' + prox.id); else go('#/grupo/' + g.id + '/' + m.id);
  };
}

function telaQuiz(modId) {
  const m = MODS[modId]; if (!m) return go('#/inicio');
  if (!quizLiberado(m)) return go('#/grupo/' + m.grupo.id + '/' + m.id);
  topo('inicio');
  const qs = QUIZZES[modId];
  if (!qs) {
    document.getElementById('app').innerHTML = `<main><div class="wrap qwrap" style="padding-bottom:40px">
      <a href="#/grupo/${m.grupo.id}/${m.id}">‹ Voltar ao grupo</a>
      <h1 style="font-size:26px">Quiz · ${esc(m.nome)}</h1>
      <p class="slab p">As perguntas deste quiz ainda não foram escritas no protótipo. Só o quiz de <b>PDV › Cardápio</b> está completo. Use os botões abaixo para simular o resultado e testar XP, selo e nível.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-sim="6">Simular 6/6</button><button class="btn ghost" data-sim="5">Simular 5/6</button><button class="btn ghost" data-sim="3">Simular 3/6 (reprova)</button></div>
    </div></main>`;
    document.querySelectorAll('[data-sim]').forEach(b => b.onclick = () => { fecharQuiz(m, +b.dataset.sim, 6, []); });
    return;
  }
  if (!ui.quiz || ui.quiz.mod !== modId) ui.quiz = { mod: modId, i: 0, sel: null, conferida: false, resp: [] };
  const Q = ui.quiz, q = qs[Q.i], certa = Q.sel === q.c;
  const dots = qs.map((_, n) => `<i class="${n < Q.resp.length ? (Q.resp[n] === qs[n].c ? 'ok' : 'bad') : n === Q.i ? 'cur' : ''}"></i>`).join('');
  document.getElementById('top').innerHTML = `
    <a href="#/grupo/${m.grupo.id}/${m.id}" style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;text-decoration:none">✕ Sair do quiz</a>
    <b style="font-size:15px;font-weight:600">Quiz · ${esc(m.nome)}</b>
    <div style="margin-left:auto;display:flex;align-items:center;gap:10px" aria-label="Pergunta ${Q.i + 1} de ${qs.length}"><div class="dots">${dots}</div><span style="font-size:13px;color:var(--muted)">${Q.i + 1} de ${qs.length}</span></div>`;
  document.getElementById('app').innerHTML = `<main><div class="wrap"><div class="qwrap">
    <div class="box" style="display:flex;gap:14px;align-items:flex-start;padding:16px 18px">
      <span class="avatar" style="width:44px;height:44px;background:#8A2D1A;color:#FFF4E8;flex:none">DL</span>
      <div style="display:flex;flex-direction:column;gap:4px"><span class="cap" style="font-size:11px">Situação de atendimento</span><p class="slab" style="margin:0;font-size:16px;line-height:1.55;color:#33435E">${esc(q.cena)}</p><span style="font-size:12px;color:var(--soft)">Dona Lúcia, cliente fictícia</span></div>
    </div>
    <h1 style="font-size:24px;line-height:1.35" id="qt">${esc(q.q)}</h1>
    <div role="radiogroup" aria-labelledby="qt" style="display:flex;flex-direction:column;gap:10px">
      ${q.o.map((o, n) => { let cls = '';
        if (Q.conferida) cls = n === q.c ? 'ok' : n === Q.sel ? 'bad' : 'dim';
        return `<button class="qopt ${cls}" role="radio" aria-checked="${Q.sel === n}" data-op="${n}" ${Q.conferida ? 'disabled' : ''}><span class="let">${'ABCD'[n]}</span><span style="flex:1">${esc(o)}</span>${Q.conferida && n === Q.sel && !certa ? '<span style="font-size:13px;font-weight:600;color:var(--red-ink)">Sua resposta</span>' : ''}${Q.conferida && n === q.c ? '<span style="font-size:13px;font-weight:600;color:var(--green-ink)">Correta</span>' : ''}</button>`; }).join('')}
    </div>
  </div></div></main>
  <section class="fb ${Q.conferida ? (certa ? 'ok' : 'bad') : 'idle'}" role="status"><div class="wrap">
    ${Q.conferida ? `<div style="flex:1;display:flex;flex-direction:column;gap:4px">
        <b style="font-size:17px;color:${certa ? 'var(--green-ink)' : 'var(--red-ink)'}">${certa ? 'Isso! +' + REGRAS.acerto + ' XP' : 'Quase.'}</b>
        <span class="slab" style="font-size:14px;line-height:1.5;color:#33435E">${esc(q.ex)}</span></div>
      <button class="btn dark" id="prox">${Q.i + 1 < qs.length ? 'Próxima pergunta' : 'Ver resultado'}</button>`
    : `<span style="flex:1;font-size:14px;color:var(--muted)">Escolha uma alternativa.</span><button class="btn" id="conf" ${Q.sel === null ? 'disabled' : ''}>Responder</button>`}
  </div></section>`;
  document.querySelectorAll('[data-op]').forEach(b => b.onclick = () => { Q.sel = +b.dataset.op; render(); document.querySelector(`[data-op="${Q.sel}"]`).focus(); });
  const conf = document.getElementById('conf');
  if (conf) conf.onclick = () => { Q.conferida = true; Q.resp.push(Q.sel); render(); fala(Q.sel === q.c ? 'Certa. ' + q.ex : 'Errada. ' + q.ex); document.getElementById('prox').focus(); };
  const prox = document.getElementById('prox');
  if (prox) prox.onclick = () => {
    if (Q.i + 1 < qs.length) { Q.i++; Q.sel = null; Q.conferida = false; render(); window.scrollTo(0, 0); }
    else { const ac = Q.resp.filter((r, n) => r === qs[n].c).length; fecharQuiz(m, ac, qs.length, Q.resp); }
  };
}

function fecharQuiz(m, acertos, total, resp) {
  const ant = S.quiz[m.id], melhorAnt = ant ? ant.melhor : 0;
  const ganho = Math.max(0, acertos - melhorAnt) * REGRAS.acerto;
  const aprovado = acertos / total >= REGRAS.aprovacao;
  S.quiz[m.id] = { melhor: Math.max(acertos, melhorAnt), total, aprovado: aprovado || (ant && ant.aprovado) };
  if (ganho) ganhar(ganho, `${aprovado ? 'Passou' : 'Fez'} o quiz ${m.nome} · ${acertos}/${total}`);
  const selo = verificaSelo(m.grupo);
  ui.resultado = { mod: m.id, acertos, total, aprovado, ganho, selo, resp, melhorAnt };
  ui.quiz = null;
  go('#/resultado/' + m.id);
}

    </aside></div>
  </div></main>`;
  if (r.selo) toast('Selo conquistado: ' + g.nome);
}

function telaConquistas() {
  topo('conquistas');
  const n = nivel();
  const qz = Object.values(S.quiz), ac = qz.reduce((s, q) => s + q.melhor, 0), tt = qz.reduce((s, q) => s + q.total, 0);
  document.getElementById('app').innerHTML = `<main><div class="wrap" style="display:flex;flex-direction:column;gap:22px">
    <section class="box" style="padding:24px 28px;display:flex;gap:32px;align-items:center;flex-wrap:wrap">
      <div style="display:flex;gap:18px;align-items:center"><span class="avatar" style="width:72px;height:72px;font-size:22px">AN</span><div><h1 style="font-size:24px">Ana Nascimento</h1><span style="font-size:13px;color:var(--muted)">Analista de suporte · entrou em 3 nov</span></div></div>
      <div style="flex:1;min-width:320px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:16px;font-weight:600">Nível ${n + 1} · ${NIVEIS[n]}</b><span style="font-size:13px;color:var(--muted)"><b style="color:var(--ink)">${S.xp}</b> XP${n < NIVEIS.length - 1 ? ' · ' + ((n + 1) * REGRAS.nivel - S.xp) + ' para o próximo' : ''}</span></div>
        <div class="bar" style="height:8px"><i style="width:${pct(S.xp - n * REGRAS.nivel, REGRAS.nivel)}%"></i></div>
        <div class="levels">${NIVEIS.map((nm, i) => `<div class="lv ${i === n ? 'cur' : ''}"><b>${i + 1} · ${nm}</b>${i * REGRAS.nivel} XP</div>`).join('')}</div>
      </div>
      <div style="display:flex;gap:26px"><div style="text-align:center"><div style="font-size:28px;font-weight:600;color:var(--orange)">${S.sequencia}</div><span style="font-size:12px;color:var(--muted)">dias seguidos</span></div><div style="text-align:center"><div style="font-size:28px;font-weight:600">${pct(ac, tt)}%</div><span style="font-size:12px;color:var(--muted)">acerto nos quizzes</span></div></div>
    </section>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px">
      <section class="box" style="padding:22px 24px;display:flex;flex-direction:column;gap:14px;grid-column:span 2" aria-labelledby="sel">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap"><h2 id="sel" style="font-size:18px">Selos de grupo · ${S.selos.size} de ${SEED.grupos.length}</h2><span class="slab" style="font-size:13px;color:var(--muted)">Passe em todos os quizzes de um grupo para ganhar o selo e +${REGRAS.selo} XP.</span></div>
        <div class="seals">${SEED.grupos.map(g => { const st = S.selos.has(g.id) ? 'done' : statusGrupo(g) === 'doing' ? 'doing' : '';
          return `<a class="seal ${st}" href="#/grupo/${g.id}">${SEAL({ c: st === 'done' ? '#12805C' : st ? '#1D9BD7' : '#B4C1D1', ok: st === 'done', f: st === 'done' ? '#DDF2E8' : 'none', s: 64 })}<b style="font-size:14px;font-weight:600;line-height:1.3">${esc(g.nome)}</b><span class="${st === 'done' ? 'chip c-done' : st ? 'chip c-doing' : ''}" style="${st ? '' : 'font-size:12px;color:var(--soft)'}">${st === 'done' ? 'Conquistado' : quizAprovados(g) + ' de ' + g.quizMods.length + (g.quizMods.length > 1 ? ' quizzes' : ' quiz')}</span></a>`; }).join('')}</div>
      </section>
      <section class="box" style="padding:22px 24px" aria-labelledby="hist"><h2 id="hist" style="font-size:18px;margin-bottom:6px">Últimas conquistas</h2>
        ${S.log.slice(0, 8).map(l => `<div class="act"><span style="width:10px;height:10px;border-radius:50%;flex:none;background:var(--blue)"></span><span style="flex:1">${esc(l.t)}<span style="display:block;font-size:12px;color:var(--soft)">${l.q}</span></span><b style="font-size:13px;font-weight:600;color:var(--blue-ink)">+${l.xp} XP</b></div>`).join('')}
      </section>
    </div>
  </div></main>`;
}

function telaBiblioteca() {
  topo('biblioteca');
  const t = sem(ui.busca.trim());
  const base = Object.values(AULAS).filter(a => !t || sem(a.titulo).includes(t) || sem(a.modulo.nome).includes(t));
  const res = base.filter(a => ui.filtroTipo[a.tipo] && (!ui.filtroGrupo.size || ui.filtroGrupo.has(a.modulo.grupo.id)) && (!ui.soNaoVistas || !S.concluidas.has(a.id)));
  const conta = f => base.filter(f).length;
  const marca = s => { if (!t) return esc(s); const i = sem(s).indexOf(t); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + t.length)) + '</mark>' + esc(s.slice(i + t.length)); };
  document.getElementById('app').innerHTML = `
  <section class="search"><div class="wrap">
    <h1 style="font-size:26px;color:#fff;text-align:center">Cliente na linha? Ache a aula certa.</h1>
    <label class="sbox"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A6B85" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span class="sr">Buscar aulas</span><input id="q" type="search" value="${esc(ui.busca)}" placeholder="Ex.: impressao, sangria, ifood" autocomplete="off"><span style="font-size:13px;color:var(--muted)">${res.length} resultados</span></label>
    <span style="font-size:13px;color:#C9D9EA;text-align:center">Busca com ou sem acento. Inclui aulas essenciais e leituras de apoio dos ${SEED.grupos.length} grupos.</span>
  </div></section>
  <main><div class="wrap glayout">
    <aside class="filters" aria-label="Filtros">
      <fieldset style="border:0;padding:0;margin:0"><legend class="cap">Tipo</legend>
        <label><input type="checkbox" data-tipo="essencial" ${ui.filtroTipo.essencial ? 'checked' : ''}>Essencial<span style="margin-left:auto;color:var(--soft);font-size:13px">${conta(a => a.tipo === 'essencial')}</span></label>
        <label><input type="checkbox" data-tipo="consulta" ${ui.filtroTipo.consulta ? 'checked' : ''}>Leitura de apoio<span style="margin-left:auto;color:var(--soft);font-size:13px">${conta(a => a.tipo === 'consulta')}</span></label>
      </fieldset>
      <fieldset style="border:0;padding:0;margin:0"><legend class="cap">Grupo</legend>
        ${SEED.grupos.map(g => { const c = conta(a => a.modulo.grupo === g); return `<label style="${c ? '' : 'color:var(--soft)'}"><input type="checkbox" data-grupo="${g.id}" ${ui.filtroGrupo.has(g.id) ? 'checked' : ''}>${esc(g.nome)}<span style="margin-left:auto;color:var(--soft);font-size:13px">${c}</span></label>`; }).join('')}
      </fieldset>
      <fieldset style="border:0;padding:0;margin:0"><legend class="cap">Status</legend>
        <label><input type="checkbox" id="nv" ${ui.soNaoVistas ? 'checked' : ''}>Só o que ainda não vi</label>
      </fieldset>
    </aside>
    <section class="list" style="flex:1;min-width:0" aria-label="Resultados">
      <div style="display:flex;justify-content:space-between;padding:14px 22px;font-size:13px;color:var(--muted)"><span><b style="color:var(--ink);font-weight:600">${res.length} ${res.length === 1 ? 'resultado' : 'resultados'}</b>${t ? ' para "' + esc(ui.busca.trim()) + '"' : ''}</span></div>
      ${res.slice(0, 60).map(a => `<a class="hit" href="#/aula/${a.id}">
        <span style="color:var(--blue);flex:none;margin-top:2px">${icon(a.modulo.grupo.idx, 32)}</span>
        <div style="flex:1;display:flex;flex-direction:column;gap:4px"><b style="font-size:16px;font-weight:600">${marca(a.titulo)}</b><span style="font-size:12px;color:var(--muted)">${esc(a.modulo.grupo.nome)} › ${esc(a.modulo.nome)}</span></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="chip ${a.tipo === 'essencial' ? 'c-doing' : 'c-todo'}">${a.tipo === 'essencial' ? 'Essencial' : 'Leitura de apoio'}</span>${S.concluidas.has(a.id) ? '<span style="font-size:12px;font-weight:600;color:var(--green-ink)">Concluída</span>' : ''}</div>
      </a>`).join('') || '<p class="slab" style="padding:22px;margin:0;color:var(--muted)">Nada encontrado. Tente outra palavra ou limpe os filtros.</p>'}
      ${res.length > 60 ? `<p style="padding:14px 22px;margin:0;font-size:13px;color:var(--muted)">Mostrando 60 de ${res.length}. Refine a busca.</p>` : ''}
    </section>
  </div></main>`;
  const q = document.getElementById('q');
  q.oninput = () => { ui.busca = q.value; const pos = q.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); };
  document.querySelectorAll('[data-tipo]').forEach(c => c.onchange = () => { ui.filtroTipo[c.dataset.tipo] = c.checked; render(); });
  document.querySelectorAll('[data-grupo]').forEach(c => c.onchange = () => { c.checked ? ui.filtroGrupo.add(c.dataset.grupo) : ui.filtroGrupo.delete(c.dataset.grupo); render(); });
  document.getElementById('nv').onchange = e => { ui.soNaoVistas = e.target.checked; render(); };
}

function telaLider() {
  if (S.papel !== 'lider') return go('#/inicio');
  topo('lider');
  const G = SEED.grupos;
  const ana = { ini: 'AN', nome: 'Ana', desde: 'desde 3 nov', selos: S.selos.size, atual: G.findIndex(g => !S.selos.has(g.id)), ess: Object.values(AULAS).filter(a => a.tipo === 'essencial' && S.concluidas.has(a.id)).length, qz: Object.values(S.quiz).filter(q => q.aprovado).length + ' aprovados', ult: 'agora' };
  const time = [
    { ini: 'FA', nome: 'Fábio', desde: 'desde 13 out', selos: 2, atual: 2, ess: 41, qz: '9 aprovados', ult: 'hoje' }, ana,
    { ini: 'CA', nome: 'Carla', desde: 'desde 27 out', selos: 1, atual: 1, ess: 22, qz: '3 aprovados', ult: 'ontem' },
    { ini: 'EL', nome: 'Elis', desde: 'desde 27 out', selos: 1, atual: 1, ess: 18, qz: '2 aprovados', ult: 'ontem' },
    { ini: 'BR', nome: 'Bruno', desde: 'desde 5 nov', selos: 0, atual: 0, ess: 2, qz: '0 aprovados', ult: 'hoje' },
    { ini: 'DI', nome: 'Diego', desde: 'desde 20 out', selos: 1, atual: 1, ess: 6, qz: '1 aprovado', ult: 'há 4 dias úteis', parado: true }
  ];
  const onde = {}; time.forEach(a => onde[a.atual] = (onde[a.atual] || 0) + 1);
  document.getElementById('app').innerHTML = `<main><div class="wrap" style="display:flex;flex-direction:column;gap:20px">
    <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap"><div><span class="cap">Líder · semana de 2 a 8 nov</span><h1 style="margin-top:2px;font-size:26px">Onboarding do time</h1></div><span class="chip" style="margin-left:auto;background:#FFF3E6;color:#9A4A0E">Dados de exemplo · a linha da Ana reflete o que você fizer no protótipo</span></div>
    <div class="kpis">
      <div class="box kpi"><span class="cap">Em onboarding</span><b>${time.length}</b><span style="font-size:12px;color:var(--muted)">2 entraram esta semana</span></div>
      <div class="box kpi"><span class="cap">Aulas essenciais concluídas</span><b>${time.reduce((s, a) => s + a.ess, 0)}</b><span style="font-size:12px;color:var(--muted)">soma do time</span></div>
      <div class="box kpi"><span class="cap">Aprovação no 1º quiz</span><b>78%</b><span style="font-size:12px;color:var(--muted)">mínimo para passar: 70%</span></div>
      <div class="box kpi" style="border-color:#F3C4A6;background:#FFF8F3"><span class="cap" style="color:var(--red-ink)">Sem atividade há 3+ dias úteis</span><b style="color:var(--red-ink)">${time.filter(a => a.parado).length}</b><span style="font-size:12px;color:var(--red-ink)">${time.filter(a => a.parado).map(a => a.nome).join(', ')}</span></div>
    </div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start">
      <section class="box tbl" style="flex:1;min-width:640px;overflow:hidden" aria-labelledby="tb">
        <div style="display:flex;align-items:center;gap:16px;padding:16px 18px;flex-wrap:wrap"><h2 id="tb" style="font-size:17px">Analistas</h2><span style="margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--muted)"><span style="display:flex;gap:6px;align-items:center"><i style="width:12px;height:12px;border-radius:3px;background:var(--green)"></i>Selo</span><span style="display:flex;gap:6px;align-items:center"><i style="width:12px;height:12px;border-radius:3px;background:#7CCBF0"></i>Grupo atual</span><span style="display:flex;gap:6px;align-items:center"><i style="width:12px;height:12px;border-radius:3px;background:#E8EEF5"></i>Não iniciado</span></span></div>
        <table><thead><tr><th scope="col">Analista</th><th scope="col">8 grupos</th><th scope="col">Grupo atual</th><th scope="col">Essenciais</th><th scope="col">Quizzes</th><th scope="col">Última atividade</th></tr></thead><tbody>
        ${time.map(a => `<tr style="${a.parado ? 'background:#FFF8F3' : ''}">
          <td><div style="display:flex;gap:10px;align-items:center"><span class="avatar" style="width:34px;height:34px;font-size:12px">${a.ini}</span><div style="line-height:1.3"><b style="font-weight:600">${a.nome}</b><div style="font-size:12px;color:var(--muted)">${a.desde}</div></div></div></td>
          <td><div class="g8" role="img" aria-label="${a.nome}: ${a.selos} selos">${G.map((_, i) => `<i class="${i < a.selos ? 's' : i === a.atual ? 'c' : ''}"></i>`).join('')}</div></td>
          <td>${esc(G[a.atual] ? G[a.atual].nome : 'Concluído')}</td>
          <td><b style="font-weight:600">${a.ess}</b><span style="color:var(--soft)"> / ${TOTAL_ESS}</span></td>
          <td>${a.qz}</td>
          <td>${a.parado ? `<span style="font-size:13px;font-weight:600;color:var(--red-ink);background:#FFEDD5;padding:3px 8px;border-radius:6px">${a.ult}</span>` : `<span style="font-size:13px;color:var(--muted)">${a.ult}</span>`}</td>
        </tr>`).join('')}
        </tbody></table>
      </section>
      <aside style="width:360px;display:flex;flex-direction:column;gap:16px">
        <section class="errs" aria-labelledby="er"><h2 id="er" style="font-size:16px;margin-bottom:10px">Perguntas com mais erro</h2>
          <div><div style="display:flex;justify-content:space-between;gap:10px"><b style="font-size:14px;font-weight:500">Copiar complementos substitui os existentes</b><span style="font-size:13px;color:#FDBA74;white-space:nowrap">4 de 6</span></div><span style="font-size:12px;color:#9FC9E6">PDV › Cardápio</span></div>
          <div><div style="display:flex;justify-content:space-between;gap:10px"><b style="font-size:14px;font-weight:500">Quem pode criar produtos</b><span style="font-size:13px;color:#FDBA74;white-space:nowrap">3 de 6</span></div><span style="font-size:12px;color:#9FC9E6">PDV › Cardápio</span></div>
          <span class="slab" style="font-size:12px;color:#9FB2C8;display:block;padding-top:10px">Pode ser a aula pedindo reforço ou a pergunta confusa.</span>
        </section>
        <section class="box" style="padding:16px 18px;display:flex;flex-direction:column;gap:8px"><b style="font-size:14px;font-weight:600">Onde o time está</b>
          ${Object.keys(onde).sort().map(i => `<div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(G[i].nome)}</span><span style="color:var(--muted)">${onde[i]}</span></div>`).join('')}
          <span style="font-size:12px;color:var(--soft)">O analista vê no próprio perfil o mesmo que o líder vê sobre ele.</span>
        </section>
      </aside>
    </div>
  </div></main>`;
}

/* =========================================================================
   ROTAS
   ========================================================================= */
function render() {
  const [, rota, a, b] = (location.hash || '#/inicio').split('/');
  if (rota !== 'quiz') ui.quiz = rota === 'quiz' ? ui.quiz : (ui.quiz && rota === 'resultado' ? null : ui.quiz && null);
  ({ inicio: telaInicio, grupo: () => telaGrupo(a, b), aula: () => telaAula(a), quiz: () => telaQuiz(a), resultado: () => telaResultado(a),
     conquistas: telaConquistas, biblioteca: telaBiblioteca, lider: telaLider }[rota] || telaInicio)();
}
let ultimaRota = '';
window.addEventListener('hashchange', () => { if (location.hash !== ultimaRota) window.scrollTo(0, 0); ultimaRota = location.hash; render(); });
render();
</script>
</body>
</html>
